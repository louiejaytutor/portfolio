<div class="max-w-6xl mx-auto">
    <div class="text-center mb-16 reveal">
        <span class="eyebrow">Get In Touch</span>
        <h2 class="font-display font-bold mt-4" style="font-size:clamp(1.8rem,3.5vw,2.6rem);">LET'S BUILD <span style="color:var(--primary)">SOMETHING</span></h2>
    </div>
    <div class="grid lg:grid-cols-5 gap-8">
        <form class="lg:col-span-3 glass p-8 space-y-5 reveal" onsubmit="event.preventDefault(); this.querySelector('.form-status').textContent='Message sent — thank you.';">
            <div class="grid sm:grid-cols-2 gap-5">
                <input class="field" type="text" placeholder="Name" required>
                <input class="field" type="email" placeholder="Email" required>
            </div>
            <input class="field" type="text" placeholder="Subject" required>
            <textarea class="field" rows="5" placeholder="Message" required></textarea>
            <button type="submit" class="btn-primary w-full justify-center">
                Send Message <i data-lucide="send" style="width: 15px; height: 15px;"></i>
            </button>
            <p class="form-status text-center text-sm font-tech" style="color: var(--primary); min-height: 1.2em;"></p>
        </form>
        <div class="lg:col-span-2 grid sm:grid-cols-2 lg:grid-cols-1 gap-5 reveal-stagger">
            <a href="mailto:louiejaytutor@hotmail.com" class="tech-card p-6 flex items-center gap-4">
                <i data-lucide="mail" style="width: 22px; height: 22px; color: var(--primary);"></i>
                <div>
                    <p class="font-tech text-xs uppercase tracking-widest" style="color: var(--muted)">Email</p>
                    <p class="font-medium text-sm">louiejaytutor@hotmail.com</p>
                </div>
            </a>
            <a href="tel:09693038864" class="tech-card p-6 flex items-center gap-4">
                <i data-lucide="phone" style="width: 22px; height: 22px; color: var(--primary);"></i>
                <div>
                    <p class="font-tech text-xs uppercase tracking-widest" style="color: var(--muted)">Phone</p>
                    <p class="font-medium text-sm">0969 303 8864</p>
                </div>
            </a>
            <a href="https://maps.app.goo.gl/ybhGQHHyCjVfsg9G7" class="tech-card p-6 flex items-center gap-4" target="_blank">
                <i data-lucide="map-pin" style="width: 22px; height: 22px; color: var(--primary);"></i>
                <div>
                    <p class="font-tech text-xs uppercase tracking-widest" style="color: var(--muted)">Location</p>
                    <p class="font-medium text-sm">Antipolo City, Rizal, PH</p>
                </div>
            </a>
            <a href="https://louiejaytutor.github.io/" class="tech-card p-6 flex items-center gap-4" target="_blank">
                <i data-lucide="globe" style="width: 22px; height: 22px; color: var(--primary);"></i>
                <div>
                    <p class="font-tech text-xs uppercase tracking-widest" style="color: var(--muted)">Portfolio</p>
                    <p class="font-medium text-sm">louiejaytutor.github.io</p>
                </div>
            </a>
        </div>
    </div>
</div>
