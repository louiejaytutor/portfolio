<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Louie Jay Tutor Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  <link rel="stylesheet" href="public/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="noise"></div>
  <div class="content-layer" style="position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;">
    <div class="particle" style="width:6px;height:6px; top:15%; left:8%; animation-delay:0s;"></div>
    <div class="particle" style="width:4px;height:4px; top:60%; left:5%; animation-delay:2s;"></div>
    <div class="particle" style="width:8px;height:8px; top:30%; left:92%; animation-delay:1s;"></div>
    <div class="particle" style="width:5px;height:5px; top:75%; left:88%; animation-delay:3s;"></div>
    <div class="particle" style="width:3px;height:3px; top:45%; left:50%; animation-delay:4s;"></div>
  </div>
  <nav id="navbar" style="position: fixed; top: 0; left: 0; right: 0; z-index: 9999;">
    <div class="max-w-7xl mx-auto px-6 lg:px-10 flex items-center justify-between h-20 relative" style="z-index:2;">
      <a href="#home" class="font-display font-bold text-lg tracking-widest" style="color:#fff;">
        LJ<span style="color:var(--primary)">TUTOR</span>
      </a>
      <div class="hidden md:flex items-center gap-10">
          <a class="nav-link active" data-target="home">Home</a>
          <a class="nav-link" data-target="about">About</a>
          <a class="nav-link" data-target="skills">Skills</a>
          <a class="nav-link" data-target="projects">Projects</a>
          <a class="nav-link" data-target="experience">Experience</a>
          <a class="nav-link" data-target="certificates">Certificates</a>
          <a class="nav-link" data-target="contact">Contact</a>
      </div>
      <div class="hidden md:block">
          <a href="#contact" class="btn-primary">Get in Touch</a>
      </div>
      <button id="menuBtn" class="md:hidden flex items-center justify-center" aria-label="Toggle menu" aria-expanded="false" style="width:44px; height:44px; color:#fff; background:transparent; border:1px solid var(--border); flex-shrink:0;">
          <i id="menuIconOpen" data-lucide="menu" style="width: 22px; height: 22px;"></i>
          <i id="menuIconClose" data-lucide="x" style="width: 22px; height: 22px; display: none;"></i>
      </button>
    </div>
    <div id="mobileMenu" class="mobile-menu md:hidden glass-strong px-6" style="position:relative; z-index:1;">
        <div class="flex flex-col gap-1 py-6 font-tech uppercase tracking-widest text-sm">
            <a class="nav-link block py-3" data-target="home">Home</a>
            <a class="nav-link block py-3" data-target="about">About</a>
            <a class="nav-link block py-3" data-target="skills">Skills</a>
            <a class="nav-link block py-3" data-target="projects">Projects</a>
            <a class="nav-link block py-3" data-target="experience">Experience</a>
            <a class="nav-link block py-3" data-target="certificates">Certificates</a>
            <a class="nav-link block py-3" data-target="contact">Contact</a>
            <a href="#contact" class="btn-primary justify-center mt-4" data-target="contact">Get in Touch</a>
        </div>
    </div>
  </nav>
  <section id="home" class="content-layer relative min-h-screen flex items-center pt-28 pb-16 px-6 lg:px-10"></section>
  <section id="about" class="content-layer relative py-28 px-6 lg:px-10 overflow-hidden"></section>
  <section id="skills" class="content-layer relative py-28 px-6 lg:px-10" style="background:linear-gradient(180deg, transparent, rgba(255,107,0,0.02), transparent);"></section>
  <section id="projects" class="content-layer relative py-28 px-6 lg:px-10"></section>
  <section id="experience" class="content-layer relative py-28 px-6 lg:px-10" style="background:linear-gradient(180deg, transparent, rgba(255,107,0,0.02), transparent);"></section>
  <section id="certificates" class="content-layer relative py-28 px-6 lg:px-10"></section>
  <section class="content-layer relative py-20 px-6 lg:px-10">
    <div class="max-w-6xl mx-auto glass-strong px-8 py-14 reveal">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-10 text-center">
        <div>
          <div class="stat-num"><span class="counter" data-target="16">0</span></div>
          <p class="font-tech uppercase tracking-widest text-xs mt-2" style="color:var(--muted)">Projects Completed</p>
        </div>
        <div>
          <div class="stat-num"><span class="counter" data-target="2">0</span>+</div>
          <p class="font-tech uppercase tracking-widest text-xs mt-2" style="color:var(--muted)">Years Experience</p>
        </div>
        <div>
          <div class="stat-num"><span class="counter" data-target="9">0</span>+</div>
          <p class="font-tech uppercase tracking-widest text-xs mt-2" style="color:var(--muted)">Happy Clients</p>
        </div>
        <div>
          <div class="stat-num"><span class="counter" data-target="100">0</span>%</div>
          <p class="font-tech uppercase tracking-widest text-xs mt-2" style="color:var(--muted)">Commitment</p>
        </div>
      </div>
    </div>
  </section>
  <section id="contact" class="content-layer relative py-28 px-6 lg:px-10"></section>

  <footer class="content-layer relative px-6 lg:px-10 py-10 border-t" style="border-color:var(--border-soft)">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
      <a href="#home" class="font-display font-bold tracking-widest">LJ<span style="color:var(--primary)">TUTOR</span></a>
      <div class="flex items-center gap-6">
        <a href="https://www.facebook.com/ljtutor/" title="Facebook" style="color: var(--muted)" target="_blank">
          <i class="fa-brands fa-facebook" style="width: 18px; height: 18px;"></i>
        </a>
        <a href="https://louiejaytutor.github.io/" title="GitHub" style="color: var(--muted)" target="_blank">
          <i class="fa-brands fa-github" style="width: 18px; height: 18px;"></i>
        </a>
        <a href="https://www.linkedin.com/in/louiejaytutor/" title="LinkedIn" style="color: var(--muted)" target="_blank">
          <i class="fa-brands fa-linkedin" style="width: 18px; height: 18px;"></i>
        </a>
      </div>
      <p class="font-tech text-xs" style="color:var(--muted)">© 2026 Louie Jay Tutor — All rights reserved</p>
      <button id="backToTop" class="w-10 h-10 flex items-center justify-center border" style="border-color: var(--border)">
        <i data-lucide="arrow-up" style="width: 16px; height: 16px; color: var(--primary)"></i>
      </button>
    </div>
  </footer>
  <script src="public/js/pages.js"></script>
  <script src="public/js/main.js"></script>
</body>
</html>
